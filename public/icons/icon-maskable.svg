<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Luxury Slate -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Liquid Silver Primary Ribbon Gradient -->
    <linearGradient id="pwaSilverMainMask" x1="10%" y1="90%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="15%" stop-color="#475569" />
      <stop offset="32%" stop-color="#94A3B8" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="76%" stop-color="#94A3B8" />
      <stop offset="90%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chrome Specular Gloss Highlight -->
    <linearGradient id="pwaChromeHighlightMask" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0" />
    </linearGradient>

    <!-- Platinum Ribbon Secondary Gradient -->
    <linearGradient id="pwaSilverSecMask" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="18%" stop-color="#334155" />
      <stop offset="38%" stop-color="#CBD5E1" />
      <stop offset="52%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="88%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Platinum Mirror Sphere Gradient -->
    <radialGradient id="pwaSphereGradMask" cx="32%" cy="28%" r="68%" fx="24%" fy="20%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#F8FAFC" />
      <stop offset="38%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <filter id="pwaShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon safe zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Logo Graphics (Scaled to 65% for safe maskable area) -->
  <g transform="translate(100, 100) scale(1.56)" filter="url(#pwaShadowMask)">
    <!-- Back Loop Shadow -->
    <path
      d="M 100 24 C 125 24, 155 60, 168 108 C 178 142, 165 170, 138 174 C 110 178, 80 152, 60 134 C 42 118, 26 142, 42 162 C 65 190, 130 190, 162 155 C 192 120, 185 55, 142 22 C 120 5, 80 8, 58 35 C 35 62, 25 105, 34 135 C 38 148, 50 150, 58 138 C 70 120, 80 60, 100 24 Z"
      fill="#0F172A"
      opacity="0.35"
    />

    <!-- Silver Lower Flange -->
    <path
      d="M 42 165 C 22 145, 20 95, 48 55 C 62 36, 82 25, 102 24 C 92 48, 76 96, 60 126 C 50 145, 36 158, 28 152 C 20 146, 25 125, 36 100 C 48 72, 65 52, 85 40 C 68 56, 52 88, 44 118 C 38 140, 48 158, 62 160 C 85 163, 115 142, 140 125 C 152 117, 162 118, 158 128 C 150 148, 120 175, 88 176 C 68 176, 50 172, 42 165 Z"
      fill="url(#pwaSilverMainMask)"
    />

    <!-- Silver Highlight Arc -->
    <path
      d="M 46 160 C 32 146, 30 108, 52 70 C 66 46, 86 32, 98 28 C 85 45, 68 85, 56 120 C 48 142, 54 154, 68 156 C 92 158, 122 138, 145 120 C 134 135, 108 158, 80 162 C 62 164, 52 163, 46 160 Z"
      fill="url(#pwaChromeHighlightMask)"
    />

    <!-- Platinum Chrome Upper Flange -->
    <path
      d="M 98 24 C 126 22, 160 52, 172 95 C 184 138, 172 166, 146 168 C 124 170, 95 146, 75 130 C 68 124, 72 115, 82 120 C 105 132, 138 150, 154 140 C 168 130, 172 95, 158 65 C 146 38, 122 26, 98 24 Z"
      fill="url(#pwaSilverSecMask)"
    />

    <!-- Chrome Specular Highlight -->
    <path
      d="M 102 26 C 128 26, 156 54, 166 90 C 174 118, 168 144, 152 148 C 162 135, 165 102, 154 75 C 142 46, 122 32, 102 26 Z"
      fill="url(#pwaChromeHighlightMask)"
    />

    <!-- Platinum Chrome Sphere (Orb) -->
    <ellipse cx="126" cy="72" rx="18" ry="12" fill="#020617" opacity="0.5" transform="rotate(15 126 72)"/>
    <circle cx="125" cy="64" r="19" fill="url(#pwaSphereGradMask)" stroke="#FFFFFF" stroke-width="0.85"/>
    <ellipse cx="119" cy="57" rx="5" ry="3.2" fill="#FFFFFF" opacity="1" transform="rotate(-25 119 57)"/>
    <ellipse cx="131" cy="71" rx="7" ry="3.5" fill="#F1F5F9" opacity="0.5" transform="rotate(35 131 71)"/>
  </g>
</svg>

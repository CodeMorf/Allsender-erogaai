name: ErogaAI External Integration Smoke

on:
  workflow_dispatch:

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      E2E_EXTERNAL_SMOKE: "true"
      E2E_SMOKE_BASE_URL: ${{ secrets.E2E_SMOKE_BASE_URL }}
      E2E_SMOKE_EMAIL: ${{ secrets.E2E_SMOKE_EMAIL }}
      E2E_SMOKE_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
      E2E_SMOKE_AI_PROVIDER: ${{ secrets.E2E_SMOKE_AI_PROVIDER }}
      E2E_SMOKE_AI_MODEL: ${{ secrets.E2E_SMOKE_AI_MODEL }}
      E2E_SMOKE_AI_API_KEY: ${{ secrets.E2E_SMOKE_AI_API_KEY }}
      E2E_SMOKE_ERP_HEALTH_URL: ${{ secrets.E2E_SMOKE_ERP_HEALTH_URL }}
      E2E_SMOKE_ERP_API_KEY: ${{ secrets.E2E_SMOKE_ERP_API_KEY }}
      E2E_SMOKE_ERP_AUTH_HEADER: ${{ secrets.E2E_SMOKE_ERP_AUTH_HEADER }}
      E2E_SMOKE_ERP_AUTH_SCHEME: ${{ secrets.E2E_SMOKE_ERP_AUTH_SCHEME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run staging external smoke
        run: npm run smoke:external

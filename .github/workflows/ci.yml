name: ErogaAI SaaS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/erogaai_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: erogaai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite & PostgreSQL)
        run: |
          npx prisma generate
          npm run db:postgres:generate

      - name: Deploy versioned PostgreSQL migrations
        run: npm run db:postgres:migrate
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/erogaai_ci?schema=public

      - name: Seed test database
        run: |
          export SUPERADMIN_INITIAL_PASSWORD="$(openssl rand -hex 32)"
          npx tsx prisma/seed.ts

      - name: TypeScript Linting Check
        run: npm run lint

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Integration Suite
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export EROGAAI_SECRET_KEY="$(openssl rand -hex 32)"
          export ENCRYPTION_KEY="$EROGAAI_SECRET_KEY"
          npx playwright test
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@localhost:5432/erogaai_ci?schema=public

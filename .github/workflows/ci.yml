name: ErogaAI SaaS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite & PostgreSQL)
        run: |
          npx prisma generate
          npm run db:postgres:generate

      - name: TypeScript Linting Check
        run: npm run lint

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

name: ErogaAI SaaS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: erogaai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite & PostgreSQL)
        run: |
          npx prisma generate
          npm run db:postgres:generate

      - name: Validate PostgreSQL Database Schema & Push
        run: npm run db:postgres:push
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/erogaai_ci?schema=public

      - name: TypeScript Linting Check
        run: npm run lint

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Integration Suite
        run: npx playwright test
        env:
          PORT: 3000
          NODE_ENV: test
          JWT_SECRET: test_ci_secret_32_characters_long_1234
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
